<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; img-src 'self' data:;" />
  <title>FoxShell - SSH 终端</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
</head>
<body>
  <div id="app">
    <!-- 左栏：连接管理器（文件夹分组） -->
    <aside id="sidebar">
      <div class="side-header">
        <img src="logo.svg" class="logo-img" alt="FoxShell" />
        <span class="logo">FoxShell</span>
      </div>
      <div class="side-search">
        <input id="searchBox" type="text" placeholder="搜索主机..." />
      </div>
      <div id="connList" class="conn-list"></div>
      <div class="side-footer">
        <div class="io-row">
          <button id="btnExportConns" class="mini-btn" style="flex:1" title="把所有连接配置导出为 JSON 文件">⬆ 导出</button>
          <button id="btnImportConns" class="mini-btn" style="flex:1" title="从 JSON 文件导入连接配置">⬇ 导入</button>
        </div>
        <button id="btnAddGroup" class="mini-btn btn-block" style="margin:8px 0">＋ 新建分组</button>
        <button id="btnAddConn" class="btn btn-primary btn-block">＋ 新建连接</button>
      </div>
    </aside>
    <div id="sideSplitter" class="splitter-v" title="拖动调整宽度"></div>

    <!-- 中/右主区域 -->
    <div id="main">
      <!-- 标签栏 -->
      <div id="tabbar">
        <div id="tabs"></div>
        <div class="tabbar-actions">
          <button id="btnToggleCmd" class="icon-btn" title="快捷命令面板">⚡ 命令</button>
          <button id="btnToggleSftp" class="icon-btn" title="文件管理 (SFTP)">📂 文件</button>
          <button id="btnForward" class="icon-btn" title="端口转发">🔀 转发</button>
          <button id="btnTermSettings" class="icon-btn" title="终端外观设置">🎨 设置</button>
          <button id="btnDisconnect" class="icon-btn" title="断开当前连接">⏻ 断开</button>
        </div>
      </div>

      <div id="content">
        <!-- 中间：终端 + 监控 -->
        <div id="center">
          <div id="welcome">
            <img src="logo.svg" class="welcome-logo-img" alt="FoxShell" />
            <h2>FoxShell</h2>
            <p>双击左侧主机建立 SSH 连接</p>
            <p class="dim">支持密码 / 密钥登录 · 跳板机 · SFTP · 资源监控 · 分屏终端 · 快捷命令</p>
          </div>
          <div id="termStack">
            <div id="searchBar" class="hidden">
              <input id="searchInput" type="text" placeholder="搜索..." spellcheck="false" />
              <button id="btnSearchPrev" class="mini-btn" title="上一个">↑</button>
              <button id="btnSearchNext" class="mini-btn" title="下一个">↓</button>
              <span id="searchCount" class="dim"></span>
              <button id="btnSearchClose" class="mini-btn" title="关闭">✕</button>
            </div>
          </div>
          <div id="monitor">
            <span id="monStatus">未连接</span>
            <div class="mon-item" id="monCpu" title="CPU 使用率">
              <span class="mon-label">CPU</span>
              <div class="bar"><div class="bar-fill"></div></div>
              <span class="mon-val">--</span>
            </div>
            <div class="mon-item" id="monMem" title="内存使用率">
              <span class="mon-label">内存</span>
              <div class="bar"><div class="bar-fill"></div></div>
              <span class="mon-val">--</span>
            </div>
            <div class="mon-item plain" title="下行 / 上行速率">
              <span class="mon-label">网络</span>
              <span class="mon-val" id="monNet">↓ -- ↑ --</span>
            </div>
            <div class="mon-item plain" title="根分区磁盘使用率">
              <span class="mon-label">磁盘</span>
              <span class="mon-val" id="monDisk">--</span>
            </div>
            <div class="mon-item plain" title="1 分钟平均负载">
              <span class="mon-label">负载</span>
              <span class="mon-val" id="monLoad">--</span>
            </div>
            <div class="mon-item plain" title="运行时长">
              <span class="mon-label">运行</span>
              <span class="mon-val" id="monUptime">--</span>
            </div>
          </div>
        </div>

        <!-- 快捷命令面板 -->
        <div id="cmdSplitter" class="splitter-v hidden"></div>
        <div id="cmdPanel" class="hidden">
          <div class="panel-title">
            <span>⚡ 快捷命令</span>
            <button id="btnCmdAdd" class="mini-btn" title="添加自定义命令">＋ 添加</button>
          </div>
          <div id="broadcastBox">
            <div class="broadcast-title">🎯 批量执行：点选要同步的终端（未选则只发当前终端）</div>
            <div id="broadcastList"></div>
          </div>
          <div id="cmdList"></div>
          <div class="panel-tip">点击命令块即在选中的终端中执行</div>
        </div>

        <!-- SFTP 文件管理 -->
        <div id="sftpSplitter" class="splitter-v hidden"></div>
        <div id="sftpPanel" class="hidden">
          <div class="sftp-toolbar">
            <button id="btnSftpUp" class="icon-btn" title="上一级">⬆</button>
            <input id="sftpPath" type="text" spellcheck="false" placeholder="远程路径" />
            <button id="btnSftpGo" class="icon-btn" title="跳转">→</button>
            <button id="btnSftpRefresh" class="icon-btn" title="刷新">⟳</button>
          </div>
          <div class="sftp-actions">
            <button id="btnSftpMkdir" class="mini-btn">＋文件夹</button>
            <button id="btnSftpUpload" class="mini-btn">⬆ 上传</button>
            <button id="btnSftpDelete" class="mini-btn">🗑 删除</button>
            <button id="btnSftpRename" class="mini-btn">✏ 重命名</button>
          </div>
          <div id="sftpHeadRow" class="sftp-row head">
            <span class="sftp-name">名称</span>
            <span class="sftp-size">大小</span>
            <span class="sftp-time">修改时间</span>
          </div>
          <div id="sftpList"></div>
          <div id="transferBar" class="hidden">
            <span id="transferLabel"></span>
            <div class="bar"><div id="transferFill" class="bar-fill"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 新建/编辑连接 -->
  <dialog id="connDialog">
    <form id="connForm" method="dialog">
      <h3 id="connDialogTitle">新建连接</h3>
      <label>名称 <input name="name" type="text" placeholder="我的服务器（留空则用主机名）" /></label>
      <div class="row2">
        <label>主机地址 <input name="host" type="text" placeholder="192.168.1.100" required /></label>
        <label>端口 <input name="port" type="number" value="22" min="1" max="65535" /></label>
      </div>
      <div class="row2">
        <label>用户名 <input name="username" type="text" value="root" required /></label>
        <label>分组
          <input name="group" type="text" list="groupSuggestions" placeholder="未分组" />
          <datalist id="groupSuggestions"></datalist>
        </label>
      </div>
      <label>认证方式
        <select name="authType" id="authTypeSel">
          <option value="password">密码登录</option>
          <option value="key">私钥登录</option>
        </select>
      </label>
      <label id="rowPassword">密码 <input name="password" type="password" placeholder="留空则保持原密码" /></label>
      <div id="rowKey">
        <label>私钥文件
          <div class="keyfile">
            <input id="keyPathText" type="text" readonly placeholder="未选择" />
            <button type="button" id="btnPickKey" class="mini-btn">选择...</button>
          </div>
        </label>
        <label>私钥口令 <input name="passphrase" type="password" placeholder="无则留空" /></label>
      </div>
      <label class="check-line"><input name="useJump" type="checkbox" id="useJumpChk" /> 通过跳板机（堡垒机）连接</label>
      <div id="rowJump" style="display:none">
        <div class="row2">
          <label>跳板机地址 <input name="jumpHost" type="text" placeholder="如 10.0.0.1" /></label>
          <label>跳板机端口 <input name="jumpPort" type="number" value="22" min="1" max="65535" /></label>
        </div>
        <div class="row2">
          <label>跳板机用户名 <input name="jumpUser" type="text" placeholder="同目标用户名" /></label>
          <label>跳板机密码 <input name="jumpPassword" type="password" placeholder="留空则保持原密码" /></label>
        </div>
      </div>
      <div class="dialog-actions">
        <button type="button" id="btnConnCancel" class="btn">取消</button>
        <button type="submit" id="btnConnSave" class="btn btn-primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 通用输入框（新建文件夹/重命名） -->
  <dialog id="promptDialog">
    <form id="promptForm" method="dialog">
      <h3 id="promptTitle">输入</h3>
      <input id="promptInput" type="text" spellcheck="false" />
      <div class="dialog-actions">
        <button type="button" id="btnPromptCancel" class="btn">取消</button>
        <button type="submit" class="btn btn-primary">确定</button>
      </div>
    </form>
  </dialog>

  <!-- 添加快捷命令 -->
  <dialog id="cmdDialog">
    <form id="cmdForm" method="dialog">
      <h3>添加命令</h3>
      <label>命令名称 <input name="cmdName" type="text" placeholder="如：查看磁盘" required /></label>
      <label>命令 <input name="cmdText" type="text" placeholder="如：df -h" spellcheck="false" required /></label>
      <div class="dialog-actions">
        <button type="button" id="btnCmdCancel" class="btn">取消</button>
        <button type="submit" class="btn btn-primary">添加</button>
      </div>
    </form>
  </dialog>

  <!-- 终端外观设置 -->
  <dialog id="termDialog">
    <form id="termForm" method="dialog">
      <h3>终端外观设置</h3>
      <div id="presetRow"></div>
      <div class="row2">
        <label>背景颜色 <input name="bg" type="color" /></label>
        <label>字体颜色 <input name="fg" type="color" /></label>
      </div>
      <label>字体样式
        <select name="font">
          <option value='Consolas, "Courier New", monospace'>Consolas（默认）</option>
          <option value='"Cascadia Mono", Consolas, monospace'>Cascadia Mono</option>
          <option value='"Courier New", monospace'>Courier New</option>
          <option value='"Lucida Console", monospace'>Lucida Console</option>
        </select>
      </label>
      <div class="row2">
        <label>字体大小（8-28） <input name="size" type="number" min="8" max="28" /></label>
        <label>光标样式
          <select name="cursor">
            <option value="block">方块 ▮</option>
            <option value="bar">竖线 ▏</option>
            <option value="underline">下划线 ▁</option>
          </select>
        </label>
      </div>
      <label class="check-line"><input name="blink" type="checkbox" /> 光标闪烁</label>
      <div class="dialog-actions">
        <button type="button" id="btnTermCancel" class="btn">取消</button>
        <button type="submit" class="btn btn-primary">应用</button>
      </div>
    </form>
  </dialog>

  <!-- 端口转发 -->
  <dialog id="fwdDialog">
    <div class="fwd-head"><h3>端口转发（本地 → 服务器 → 目标）</h3></div>
    <div id="fwdList"></div>
    <form id="fwdForm" method="dialog">
      <div class="row2">
        <label>本地端口 <input name="localPort" type="number" min="1" max="65535" placeholder="8080" required /></label>
        <label>目标主机 <input name="dstHost" type="text" placeholder="127.0.0.1" value="127.0.0.1" required /></label>
        <label>目标端口 <input name="dstPort" type="number" min="1" max="65535" placeholder="3306" required /></label>
      </div>
      <div class="dialog-actions">
        <button type="button" id="btnFwdClose" class="btn">关闭</button>
        <button type="submit" class="btn btn-primary">＋ 添加规则</button>
      </div>
    </form>
    <div class="panel-tip">添加后点「启动」：本机访问 127.0.0.1:本地端口 即等于访问服务器侧的目标主机:目标端口</div>
  </dialog>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-search/lib/addon-search.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
